<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Seek Game Demo</title>
    <!-- 空 data URI：占住 favicon 位置，避免线上每次访问都打一个 /favicon.ico 404。
         换正式图标时把 href 改成 './favicon.ico' 并把文件放进 public/。 -->
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        /* 页面自身不滚动：EXPAND 负责等比铺满窗口，小窗口也不出现滚动条 */
        overflow: hidden;
        background: #111111;
      }
      /* 游戏容器铺满视口：尺寸路径只走 CSS，不再由 JS 设高度 */
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #111111;
      }
      /* 触摸屏：禁掉画布上的浏览器手势（滚动/双击缩放/长按菜单），输入全部交给游戏 */
      #game canvas {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        background-color: #111111;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
