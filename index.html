<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Seek Game Demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        /* 页面自身不滚动：FIT 已按窗口等比缩放（小窗口曾出现整页滚动条） */
        overflow: hidden;
        background: #111111;
      }
      /* 游戏容器铺满视口：尺寸路径只走 CSS，不再由 JS 设高度 */
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      /* 触摸屏：禁掉画布上的浏览器手势（滚动/双击缩放/长按菜单），输入全部交给游戏 */
      #game canvas {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
